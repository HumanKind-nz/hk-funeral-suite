name: Build Plugin Release
on:
  push:
    tags:
      - "*"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build compiled assets (blocks + settings)
        run: npm run build

      - name: Verify build output exists
        run: |
          test -f build/settings/index.js || { echo "::error::Settings bundle missing — build failed"; exit 1; }
          test -d build/blocks || { echo "::error::Blocks build missing — build failed"; exit 1; }

      - name: Stage plugin files
        run: |
          mkdir -p dist/hk-funeral-suite
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.nova' \
            --exclude='.claude' \
            --exclude='.DS_Store' \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='screenshots' \
            --exclude='CLAUDE.md' \
            --exclude='MODERNISATION-PLAN.md' \
            --exclude='phpcs.xml.dist' \
            --exclude='webpack.scripts.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            . dist/hk-funeral-suite/

      - name: Create zip file
        run: cd dist && zip -r hk-funeral-suite-${{ env.VERSION }}.zip hk-funeral-suite

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/hk-funeral-suite-${{ env.VERSION }}.zip
